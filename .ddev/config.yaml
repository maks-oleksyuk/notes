name: notes
type: generic
webserver_type: generic
nodejs_version: '22'
corepack_enable: true
omit_containers: [db]
web_extra_daemons:
  - name: 'vitepress'
    command: 'pnpm dev'
    directory: /var/www/html
web_extra_exposed_ports:
  - name: vitepress
    container_port: 5173
    http_port: 80
    https_port: 443
hooks:
  pre-start:
    - exec-host: |
        ddev add-on list --installed | grep -q 'envsa/ddev-pnpm' || ddev add-on get envsa/ddev-pnpm > /dev/null
  post-start:
    - exec: pnpm i
