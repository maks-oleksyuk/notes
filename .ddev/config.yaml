name: laravel
type: laravel
docroot: public
database:
  type: postgres
  version: '17'
php_version: '8.5'
host_db_port: '14674'
nodejs_version: '24'
webserver_type: generic
xdebug_enabled: false
upload_dirs:
  - ../storage/app/public
web_extra_daemons:
  - name: 'queue'
    command: 'php artisan queue:work'
    directory: /var/www/html
  - name: 'nightwatch'
    command: 'php artisan nightwatch:agent'
    directory: /var/www/html
  - name: 'pulse'
    command: 'php artisan pulse:check'
    directory: /var/www/html
webimage_extra_packages:
  - aspell
  - aspell-en
hooks:
  pre-start:
    # Add frankenphp, pnpm and task to ddev if not already installed.
    - exec-host: |
        ddev add-on list --installed | grep -q 'ddev/ddev-pnpm' || ddev add-on get ddev/ddev-pnpm > /dev/null
        ddev add-on list --installed | grep -q 'ddev/ddev-frankenphp' || ddev add-on get ddev/ddev-frankenphp > /dev/null
        ddev add-on list --installed | grep -q 'gebruederheitz/ddev-taskfile' || ddev add-on get gebruederheitz/ddev-taskfile > /dev/null
  post-start:
    - composer: install
    - exec: pnpm install
  post-import-db:
    - exec: php artisan migrate --force --ansi
