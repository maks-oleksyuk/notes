name: drupal
type: drupal
docroot: web
database:
  type: mariadb
  version: '12.3'
php_version: '8.5'
nodejs_version: '26'
webserver_type: nginx-fpm
xdebug_enabled: false
upload_dirs:
  - ../var
  - ../local
  - ../node_modules
hooks:
  pre-start:
    # Add pnpm and task to ddev if not already installed.
    - exec-host: |
        ddev add-on list --installed | grep -q 'ddev-pnpm'     || ddev add-on get ddev/ddev-pnpm > /dev/null
        ddev add-on list --installed | grep -q 'ddev-taskfile' || ddev add-on get gebruederheitz/ddev-taskfile > /dev/null
  post-start:
    - composer: install
    - exec: pnpm install --color=always
