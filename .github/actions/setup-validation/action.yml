name: '⚙️ Setup environment'
description: 'Setups environment for validation tasks.'

inputs:
  php:
    description: 'PHP version to install'
    required: true
    default: '8.5'

  node:
    description: 'Node.js version to install'
    required: true
    default: '26.x'

  use-php:
    description: 'Whether to install PHP and dependencies'
    required: false
    default: 'false'

  use-node:
    description: 'Whether to install Node.js and dependencies'
    required: false
    default: 'false'

  use-db:
    description: 'Whether to use db'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: '📋 Install Task'
      shell: bash
      run: curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

    - name: '🐘 Setup PHP ${{ inputs.php }}'
      if: ${{ inputs.use-php == 'true' }}
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php }}
        coverage: none
        tools: cs2pr

    - name: '🗃 Get composer cache directory'
      if: ${{ inputs.use-php == 'true' }}
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: '💽 Cache composer dependencies'
      if: ${{ inputs.use-php == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: "${{ runner.os }}-${{ github.ref_name }}-composer-${{ hashFiles('**/composer.lock') }}"
        restore-keys: |
          ${{ runner.os }}-${{ github.head_ref || github.ref_name }}-composer-
          ${{ runner.os }}-${{ github.base_ref }}-composer-

    - name: '💽 Cache var directory'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.use-php == 'true' }}
      with:
        path: var
        key: '${{ runner.os }}-${{ github.ref_name }}-var'
        restore-keys: |
          ${{ runner.os }}-${{ github.head_ref || github.ref_name }}-var
          ${{ runner.os }}-${{ github.base_ref }}-var

    - name: '📦 Install composer dependencies'
      if: ${{ inputs.use-php == 'true' }}
      shell: bash
      run: composer install --no-interaction --no-progress --no-scripts --ansi;

    - name: '🟧 Setup pnpm & Node.js ${{ inputs.node }}'
      if: ${{ inputs.use-node == 'true' }}
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@${{ inputs.node }}
        require-lockfile: true
        cache: true

    - name: '🧰 Set up Laravel'
      if: ${{ inputs.use-db == 'true' }}
      shell: bash
      run: |
        cp .env.example .env
        sed -i -e '/^DB_HOST=/s/=.*/=127.0.0.1/' -e 't' -e '$aDB_HOST=127.0.0.1' .env
        php artisan migrate:fresh --force --ansi
        php artisan ide-helper:models --write-mixin -n --ansi
