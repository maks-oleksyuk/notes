name: '⚙️ Setup environment'
description: 'Setups environment for testing tasks.'

inputs:
  php:
    description: 'PHP version to install'
    required: true
    default: '8.4'

runs:
  using: composite
  steps:
    - name: '📋 Install Task'
      shell: bash
      run: sh -c "$(curl -s --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin > /dev/null 2>&1

    - name: '🐘 Setup PHP ${{ inputs.php }}'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php }}
        coverage: xdebug
        extensions: pdo, pdo_mysql

    - name: '🗃 Get composer cache directory'
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: '💽 Cache composer dependencies'
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: "composer-cache-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('**/composer.lock') }}"
        restore-keys: |
          composer-cache-${{ runner.os }}-${{ github.head_ref || github.ref_name }}
          composer-cache-${{ runner.os }}-${{ github.base_ref }}
          composer-cache-${{ runner.os }}-symfony

    - name: '💽 Cache var directory'
      uses: actions/cache@v4
      with:
        path: var
        key: "var-${{ runner.os }}-${{ github.head_ref || github.ref_name }}"
        restore-keys: |
          var-cache-${{ runner.os }}-${{ github.head_ref || github.ref_name }}
          var-cache-${{ runner.os }}-${{ github.base_ref }}
          var-cache-${{ runner.os }}-symfony

    - name: '📦 Install composer dependencies'
      shell: bash
      run: composer i --no-progress --no-scripts -qn --ansi;

    - name: '⚜️ Set up Symfony'
      shell: bash
      run: |
        cp .env.example .env
        sed -i -e '/^APP_ENV=/s/=.*/=test/' -e 't' -e '$aAPP_ENV=test' .env
        sed -i -e '/^DB_HOST=/s/=.*/=127.0.0.1/' -e 't' -e '$aDB_HOST=127.0.0.1' .env
        php bin/console doctrine:database:create --env=test --if-not-exists -q
        php bin/console doctrine:schema:create --env=test -q
        php bin/console cache:clear --env=test -q
        php bin/console cache:warmup --env=test -q
