name: '⚙️ Setup environment'
description: 'Setups environment for testing tasks.'

inputs:
  php:
    description: 'PHP version to install'
    required: true
    default: '8.5'

runs:
  using: composite
  steps:
    - name: '📋 Install Task'
      shell: bash
      run: sh -c "$(curl -s --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin > /dev/null 2>&1

    - name: '🐘 Setup PHP ${{ inputs.php }}'
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php }}
        coverage: xdebug
        extensions: pdo, pdo_mysql

    - name: '🗃 Get composer cache directory'
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: '💽 Cache composer dependencies'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: "${{ runner.os }}-${{ github.ref_name }}-composer-${{ hashFiles('**/composer.lock') }}"
        restore-keys: |
          ${{ runner.os }}-${{ github.head_ref || github.ref_name }}-composer-
          ${{ runner.os }}-${{ github.base_ref }}-composer-
          ${{ runner.os }}-symfony-composer-

    - name: '💽 Cache var directory'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: var/cache
        key: "${{ runner.os }}-${{ github.ref_name }}-var"
        restore-keys: |
          ${{ runner.os }}-${{ github.head_ref || github.ref_name }}-var
          ${{ runner.os }}-${{ github.base_ref }}-var
          ${{ runner.os }}-symfony-var

    - name: '📦 Install composer dependencies'
      shell: bash
      run: composer i --no-progress --no-scripts -qn --ansi;

    - name: '⚜️ Set up Symfony'
      shell: bash
      run: |
        cp .env.example .env
        sed -i -e '/^APP_ENV=/s/=.*/=test/' -e 't' -e '$aAPP_ENV=test' .env
        sed -i -e '/^DB_HOST=/s/=.*/=127.0.0.1/' -e 't' -e '$aDB_HOST=127.0.0.1' .env
        php bin/console doctrine:database:create --env=test --if-not-exists -q
        php bin/console doctrine:schema:create --env=test -q
        php bin/console cache:clear --env=test -q
        php bin/console cache:warmup --env=test -q
