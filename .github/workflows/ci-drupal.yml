name: '🔄 CI | 💧 Drupal'

on:
  push:
    branches:
      - drupal
    paths-ignore:
      - README.md
      - LICENSE.md
  pull_request:
    branches:
      - drupal
    paths-ignore:
      - README.md
      - LICENSE.md

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: '🧹 Clean up GitHub repo'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    if: github.event_name != 'pull_request'

    steps:
      - name: '🗑 Delete workflow runs'
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 7
          keep_minimum_runs: 1
          delete_workflow_pattern: ci-drupal.yml

  lint:
    name: '🪄 Lint | ${{ matrix.command.name }}'
    runs-on: ubuntu-latest
    permissions: {}

    strategy:
      fail-fast: false
      matrix:
        command:
          - { name: '📦 Composer', command: 'lint:composer', php: true }
          - { name: '📝 Cspell', command: 'lint:spellcheck', php: true, node: true }
          - { name: '☕️ JS', command: 'lint:js', php: true, node: true }
          - { name: '🐘 PHPCS', command: 'lint:phpcs', php: true }
          - { name: '🔍 PHPStan', command: 'lint:phpstan', php: true }
          - { name: '🅿️ Prettier', command: 'lint:prettier', php: true, node: true }
          - { name: '🏠 Rector', command: 'lint:rector', php: true }
          - { name: '👔 Stylelint', command: 'lint:style', php: true, node: true }
          - { name: '🌿 Twig', command: 'lint:twig', php: true }
          - { name: '📄 YML', command: 'lint:yml', php: true, node: true }

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '⚙️ Prepare environment'
        uses: $/.github/actions/setup-validation
        with:
          use-php: ${{ matrix.command.php }}
          use-node: ${{ matrix.command.node }}

      - name: '${{ matrix.command.name }} validate'
        run: task ${{ matrix.command.command }}
