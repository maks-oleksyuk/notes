name: '🔄 CI | 🚾 Wordpress'

on:
  push:
    branches:
      - wordpress
    paths-ignore:
      - README.md
      - LICENSE.md
  pull_request:
    branches:
      - wordpress
    paths-ignore:
      - README.md
      - LICENSE.md

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: '🧹 Clean up GitHub repo'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    if: github.event_name != 'pull_request'

    steps:
      - name: '🗑 Delete workflow runs'
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 7
          keep_minimum_runs: 1
          delete_workflow_pattern: ci-wordpress.yml

  lint:
    name: '🪄 Lint | ${{ matrix.command.name }}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        command:
          - {
              name: '📦 Composer',
              command: 'lint:composer',
              use-php: true,
            }
          - {
              name: '🐘 PHPCS',
              command: 'lint:phpcs -- -q',
              use-php: true,
            }
          - {
              name: '🅿️ Prettier',
              command: 'lint:prettier',
              use-node: true,
            }

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '⚙️ Prepare environment'
        uses: ./.github/actions/setup-validation
        with:
          use-php: ${{ matrix.command.use-php }}
          use-node: ${{ matrix.command.use-node }}

      - name: '${{ matrix.command.name }} validate'
        run: task ${{ matrix.command.command }}
