name: '🚀 CD | ⚫ Next.js'

on:
  push:
    branches:
      - next-js

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: '${{ github.repository }}-next-js'

jobs:
  resolve:
    name: '🚦 Resolve'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag:         ${{ steps.out.outputs.tag }}
      dockerfile:  ${{ steps.out.outputs.dockerfile }}
      environment: ${{ steps.out.outputs.environment }}
      deploy_name: ${{ steps.out.outputs.deploy_name }}

    steps:
      - name: '🚦 Resolve'
        id: out
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            next-js) tag=dev;    env=next-js; name="🟢 Dev";   file=".docker/dev/node/Dockerfile"   ;;
            stage)   tag=stage;  env=stage;   name="🟡 Stage"; file=".docker/stage/node/Dockerfile" ;;
            main)    tag=latest; env=prod;    name="🔴 Prod";  file=".docker/prod/node/Dockerfile"  ;;
          esac

          echo "tag=$tag"          >> $GITHUB_OUTPUT
          echo "dockerfile=$file"  >> $GITHUB_OUTPUT
          echo "environment=$env"  >> $GITHUB_OUTPUT
          echo "deploy_name=$name" >> $GITHUB_OUTPUT

  build-and-push:
    name: '🐳 Build & Push'
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
      packages: write

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🔑 Log in to GitHub Container Registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: '🏷️ Extract metadata'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ needs.resolve.outputs.tag }}

      - name: '⚙️ Set up Docker Buildx'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: '🐳 Build and push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ needs.resolve.outputs.dockerfile }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            better_auth_url=http://localhost:3000
            better_auth_secret=build-placeholder-0000000000000000000000

  cleanup:
    name: '️🧹 Cleanup'
    runs-on: ubuntu-latest
    needs: [resolve, build-and-push]
    permissions:
      actions: write
      packages: write
      deployments: write

    steps:
      - name: '🗑️ Delete old container versions'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: '${{ github.event.repository.name }}-next-js'
          package-type: container
          delete-only-untagged-versions: true

      - name: '🗑 Delete deployment'
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476 # v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ needs.resolve.outputs.environment }}
          onlyRemoveDeployments: true

      - name: '🗑 Delete workflow runs'
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 7
          keep_minimum_runs: 1
          delete_workflow_pattern: cd-next-js.yml

  deploy:
    name: '🚀 Deploy | ${{ needs.resolve.outputs.deploy_name }}'
    runs-on: ubuntu-latest
    needs: [resolve, cleanup]
    environment: ${{ needs.resolve.outputs.environment }}
    permissions: {}

    steps:
      - name: '🌐 Demo Deploy Step'
        run: echo "Trigger deploy here (demo mode)"

      # - name: '🌐 Dokploy | ${{ needs.resolve.outputs.deploy_name }}'
      #  uses: benbristow/dokploy-deploy-action@0.2.2
      #  with:
      #    dokploy_url: ${{ secrets.DOKPLOY_URL }}
      #    api_token: ${{ secrets.DOKPLOY_TOKEN }}
      #    application_id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
      #    service_type: compose