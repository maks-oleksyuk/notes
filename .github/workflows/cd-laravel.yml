name: '🚀 CD | 🧰 Laravel'

on:
  push:
    branches:
      - laravel
       - chore/laravel-updates

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: '${{ github.repository }}-laravel'

jobs:
  resolve:
    name: '🚦 Resolve'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag:         ${{ steps.out.outputs.tag }}
      dockerfile:  ${{ steps.out.outputs.dockerfile }}
      environment: ${{ steps.out.outputs.environment }}
      deploy_name: ${{ steps.out.outputs.deploy_name }}

    steps:
      - name: '🚦 Resolve'
        id: out
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            laravel | chore/laravel-updates) tag=dev;    env=laravel; name="🟢 Dev";   file=".docker/dev/php/Dockerfile"   ;;
            stage)   tag=stage;  env=stage;   name="🟡 Stage"; file=".docker/stage/php/Dockerfile" ;;
            main)    tag=latest; env=prod;    name="🔴 Prod";  file=".docker/prod/php/Dockerfile"  ;;
          esac

          echo "tag=$tag"          >> $GITHUB_OUTPUT
          echo "dockerfile=$file"  >> $GITHUB_OUTPUT
          echo "environment=$env"  >> $GITHUB_OUTPUT
          echo "deploy_name=$name" >> $GITHUB_OUTPUT

  build-and-push:
    name: '🐳 Build & Push'
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
      packages: write

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: '🔑 Log in to GitHub Container Registry'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: '🏷️ Extract metadata'
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ needs.resolve.outputs.tag }}

      - name: '⚙️ Set up Docker Buildx'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: '🐳 Build and push'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ needs.resolve.outputs.dockerfile }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    name: '️🧹 Cleanup'
    runs-on: ubuntu-latest
    needs: [resolve, build-and-push]
    permissions:
      actions: write
      packages: write
      deployments: write

    steps:
      - name: '🗑️ Delete old container versions'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: '${{ github.event.repository.name }}-laravel'
          package-type: container
          delete-only-untagged-versions: true

      - name: '🗑 Delete deployment'
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476 # v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ needs.resolve.outputs.environment }}
          onlyRemoveDeployments: true

      - name: '🗑 Delete workflow runs'
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 7
          keep_minimum_runs: 1
          delete_workflow_pattern: cd-laravel.yml

  deploy:
    name: '🚀 Deploy | ${{ needs.resolve.outputs.deploy_name }}'
    runs-on: ubuntu-latest
    needs: [resolve, cleanup]
    environment: ${{ needs.resolve.outputs.environment }}
    permissions: {}

    steps:
      - name: '🌐 Demo Deploy Step'
        run: echo "Trigger deploy here (demo mode)"

      # - name: '🌐 Dokploy | ${{ needs.resolve.outputs.deploy_name }}'
      #  uses: benbristow/dokploy-deploy-action@0.2.2
      #  with:
      #    dokploy_url: ${{ secrets.DOKPLOY_URL }}
      #    api_token: ${{ secrets.DOKPLOY_TOKEN }}
      #    application_id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
      #    service_type: compose
