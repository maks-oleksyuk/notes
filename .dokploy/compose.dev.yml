services:
  app:
    image: ghcr.io/maks-oleksyuk/notes-symfony:dev
    restart: unless-stopped
    expose:
      - 8080
      - 8443
    env_file:
      - .env
    environment:
      APP_ENV: dev
      PHP_OPCACHE_ENABLE: '0'
      AUTORUN_ENABLED: 'false'
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../files/var/log:/var/www/html/var/log
    post_start:
      - command: chown -R www-data:www-data /var/www/html/var && chmod -R 775 /var/www/html/var
        user: root
    networks:
      - internal
#      - dokploy-network

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_USER: notes
      MARIADB_DATABASE: symfony
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    expose:
      - 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
#      - internal
      internal:
        aliases:
          - notes-db

volumes:
  db_data:

networks:
  internal:
    driver: bridge
#  dokploy-network:
#    external: true
