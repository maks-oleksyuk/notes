services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 8080
      - 8443
    env_file:
      - .env
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://app:${DB_PASSWORD}@db:3306/app?serverVersion=mariadb-11.8.1&charset=utf8mb4
      PHP_OPCACHE_ENABLE: "0"
      AUTORUN_ENABLED: "true"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_USER: notes
      MARIADB_DATABASE: symfony
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
