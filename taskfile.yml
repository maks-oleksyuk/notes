version: '3'

env:
  PHP_BIN: '{{.PHP_BIN | default "$(which php)"}}'
  NODE_BIN: '{{.NODE_BIN | default "$(which node)"}}'
  PNPM_BIN: '{{.PNPM_BIN | default "$(which pnpm)"}}'
  COMPOSER_BIN: '{{.COMPOSER_BIN | default "$(which composer)"}}'

vars:
  CONFIG_DIR: '{{.TASKFILE_DIR}}/config/utils'
  NODEJS_BIN_DIR: '{{.TASKFILE_DIR}}/node_modules/.bin'
  COMPOSER_BIN_DIR: '{{.TASKFILE_DIR}}/vendor/bin'

tasks:
  default:
    desc: 'List all command.'
    cmd: 'task --list-all'

  # Utils.

  composer:
    label: 'Composer'
    desc: 'Runs `composer` command.'
    internal: true
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN}} {{.CLI_ARGS}} --ansi'

  pnpm:
    label: 'pnpm'
    desc: 'Runs `pnpm` command.'
    internal: true
    cmd: '{{.PNPM_BIN}} {{.CLI_ARGS}}'

  bin/console:
    label: 'Symfony console'
    desc: 'Runs Symfony `bin/console` command.'
    aliases:
      - sf
      - console
      - symfony
      - sf:console
    cmd: '{{.PHP_BIN}} bin/console {{.CLI_ARGS}} --ansi'

  php-cs-fixer:
    label: 'PHP CS Fixer'
    desc: 'Runs `php-cs-fixer` command.'
    aliases:
      - cs-fixer
      - php:cs-fixer
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/php-cs-fixer fix
      --config {{.CONFIG_DIR}}/.php-cs-fixer.php -v {{.CLI_ARGS}} --ansi'

  prettier:
    label: 'Prettier'
    desc: 'Runs `prettier` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/prettier {{.CLI_ARGS}}
      --config={{.CONFIG_DIR}}/.prettierrc.json
      --ignore-path={{.CONFIG_DIR}}/.prettierignore'

  rector:
    label: 'Rector'
    desc: 'Runs `rector` command.'
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/rector process
      --config={{.CONFIG_DIR}}/rector.php {{.CLI_ARGS}} --ansi'

  phpstan:
    label: 'PHPStan'
    desc: 'Runs `phpstan` command.'
    aliases:
      - php:stan
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpstan
      --configuration={{.CONFIG_DIR}}/phpstan.neon {{.CLI_ARGS}} --ansi'

  # Work commands.

  # Linters.

  lint:
    label: 'Project lint'
    desc: 'Validates project files.'
    aliases:
      - l
    cmds:
      - task: lint:composer
      - task: lint:php:cs-fixer
      - task: lint:prettier
      - task: lint:php:stan
      - task: lint:rector

  lint:composer:
    label: 'Composer validation'
    desc: 'Validates composer.json file and checks platform requirements.'
    aliases:
      - l:composer
    cmds:
      - task: composer
        vars: { CLI_ARGS: '-V' }
      - task: composer
        vars: { CLI_ARGS: 'validate --strict' }
      - task: composer
        vars: { CLI_ARGS: 'check-platform-req' }

  lint:prettier:
    label: 'Prettier'
    desc: 'Checks for common format issues with prettier.'
    aliases:
      - format
      - l:format
      - l:prettier
      - lint:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-v' }
      - task: prettier
        vars: { CLI_ARGS: '-c .' }

  lint:phpstan:
    label: 'PHPStan analyze'
    desc: 'Analyze PHP code for bugs and errors.'
    aliases:
      - l:stan
      - l:phpstan
      - l:php:stan
      - lint:stan
      - lint:phpstan
      - lint:php:stan
    cmds:
      - task: phpstan
        vars: { CLI_ARGS: 'analyze' }

  lint:rector:
    label: 'Rector check'
    desc: 'Check Rector issues.'
    aliases:
      - l:rector
    cmds:
      - task: rector
        vars: { CLI_ARGS: '--dry-run' }

  lint:php:cs-fixer:
    label: 'PHP CS Fixer validation'
    desc: 'Lint php files.'
    aliases:
      - l:php
      - lint:php
      - l:php-cs-fixer
      - lint:php-cs-fixer
    cmds:
      - task: php-cs-fixer
        vars: { CLI_ARGS: '--dry-run --diff' }

  # Fixing.

  fix:
    label: 'Fixing found issues'
    desc: 'Trying for automated fixes for found problems.'
    aliases:
      - f
    cmds:
      - task: fix:prettier
      - task: fix:rector

  fix:prettier:
    label: 'Prettier'
    desc: 'Fix format issues.'
    aliases:
      - f:format
      - f:prettier
      - fix:format
      - format:fix
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-wl .' }

  fix:php:cs-fixer:
    label: 'PHP CS Fixer'
    desc: 'Fix PHP CS Fixer issues.'
    aliases:
      - f:php
      - fix:php
      - f:php-cs-fixer
      - fix:php-cs-fixer
    cmds:
      - task: php:cs-fixer

  fix:rector:
    label: 'Rector'
    desc: 'Fix Rector issues.'
    aliases:
      - f:rector
    cmds:
      - task: rector
