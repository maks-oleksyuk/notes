version: 3

env:
  PHP_BIN: '{{.PHP_BIN | default "$(which php)"}}'
  NODE_BIN: '{{.NODE_BIN | default "$(which node)"}}'
  PNPM_BIN: '{{.PNPM_BIN | default "$(which pnpm)"}}'
  COMPOSER_BIN: '{{.COMPOSER_BIN | default "$(which composer)"}}'

vars:
  CONFIG_DIR: '{{.TASKFILE_DIR}}/config/utils'
  NODEJS_BIN_DIR: '{{.TASKFILE_DIR}}/node_modules/.bin'
  COMPOSER_BIN_DIR: '{{.TASKFILE_DIR}}/vendor/bin'

dotenv: ['.env.local', '.env']

tasks:
  default:
    desc: 'List all commands.'
    cmd: 'task -l'

  # Utils:

  composer:
    desc: 'Runs `composer` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN}} {{.CLI_ARGS}} --ansi'
    internal: true
    silent: true

  pnpm:
    desc: 'Runs `pnpm` command.'
    cmd: '{{.PNPM_BIN}} {{.CLI_ARGS}}'
    internal: true
    silent: true

  bin/console:
    desc: 'Runs Symfony `bin/console` command.'
    aliases:
      - c
      - sf
      - console
      - symfony
      - sf:console
    cmd: '{{.PHP_BIN}} bin/console {{.CLI_ARGS}} --ansi'
    silent: true

  bin/phpunit:
    desc: 'Runs `bin/phpunit` command.'
    aliases:
      - unit
      - phpunit
    cmd:
      '{{.PHP_BIN}} bin/phpunit
      -c {{.CONFIG_DIR}}/phpunit.dist.xml
      {{.CLI_ARGS}} --colors=always'
    env:
      APP_ENV: test
    silent: true

  php-cs-fixer:
    desc: 'Runs `php-cs-fixer` command.'
    aliases:
      - csf
      - cs-fixer
      - php:cs-fixer
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/php-cs-fixer fix
      --config {{.CONFIG_DIR}}/.php-cs-fixer.php -v {{.CLI_ARGS}} --ansi'
    silent: true

  phpstan:
    desc: 'Runs `phpstan` command.'
    aliases:
      - php:stan
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpstan
      --configuration={{.CONFIG_DIR}}/phpstan.neon {{.CLI_ARGS}} --ansi'
    silent: true

  rector:
    desc: 'Runs `rector` command.'
    aliases:
      - r
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/rector {{.CLI_ARGS}}
      --config={{.CONFIG_DIR}}/rector.php --ansi'
    silent: true

  twig-cs-fixer:
    desc: 'Runs `twig-cs-fixer` command.'
    aliases:
      - tcsf
      - twig:cs-fixer
    cmd: '
      {{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/twig-cs-fixer
      lint --config={{.CONFIG_DIR}}/.twig-cs-fixer.php
      {{.CLI_ARGS}} --ansi'
    silent: true

  prettier:
    desc: 'Runs `prettier` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/prettier {{.CLI_ARGS}}
      --config={{.CONFIG_DIR}}/.prettierrc.json
      --ignore-path={{.CONFIG_DIR}}/.prettierignore
      --cache --cache-location=var/cache/prettier/prettier.cache'
    silent: true

  # Work commands:

  cache:clear:
    desc: ' Clears the application cache for a given environment.'
    aliases:
      - cc
      - cr
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: 'cache:clear' }
    silent: true

  deploy:
    desc: 'Deploy code'
    aliases:
      - d
    vars:
      DEV_PACKAGES: '{{if eq .APP_ENV "prod"}}--no-dev{{end}}'
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'i {{.DEV_PACKAGES}} --no-scripts' }
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:migration:migrate -n' }
      - task: cache:clear
      - task: sf:console
        vars: { CLI_ARGS: 'cache:warmup' }

  init:
    desc: 'Run post-start initialization (migrations, cache).'
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:migrations:migrate -n' }
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:fixtures:load --append -n' }
      - task: sf:console
        vars: { CLI_ARGS: 'cache:warmup' }

  update:
    desc: 'Updates project dependencies withing constraints.'
    prompt: |
      This command can break website. Do it independently without any other active changes.
      Make sure you have a backup. Never run it on production.
    aliases:
      - u
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'u -W' }
      - task: pnpm
        vars: { CLI_ARGS: 'up --save --latest' }

  # Migrations:

  migrations:create:
    desc: 'Generate a new migration based on current schema'
    aliases:
      - m:c
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:migrations:diff --formatted {{.CLI_ARGS}}' }

  migrations:run:
    desc: 'Apply all pending migrations'
    aliases:
      - m
      - m:s
      - m:r
      - migrate
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:migrations:migrate {{.CLI_ARGS}}' }

  migrations:rerun-last:
    desc: 'Rollback and re-apply the last migration'
    aliases:
      - m:l
      - m:last
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:migrations:migrate prev -n' }
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:migrations:migrate next -n' }

  migrations:reset:
    desc: 'Drop schema, clear versions, rerun migrations and load fixtures.'
    aliases:
      - m:reset
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:schema:drop --force' }
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:migrations:version --delete --all -q -n' }
      - task: migrations:run
        vars: { CLI_ARGS: '-n' }
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:fixtures:load --append -n' }

  # Linters:

  lint:
    desc: 'Run all linters and validators.'
    aliases:
      - l
    cmds:
      - defer: { task: lint:prettier }
      - defer: { task: lint:twig }
      - defer: { task: lint:rector }
      - defer: { task: lint:phpstan }
      - defer: { task: lint:php-cs-fixer }
      - defer: { task: lint:symfony }
      - defer: { task: lint:composer }
      - defer: { task: lint:commit }
      - defer: { task: lint:branch }

  lint:branch:
    desc: 'Validates the current git branch name.'
    aliases:
      - l:b
      - lint:b
    cmds:
      - task: pnpm
        vars: { CLI_ARGS: 'validate-branch-name -v' }
      - task: pnpm
        vars: { CLI_ARGS: 'validate-branch-name' }

  lint:commit:
    desc: 'Run commit message validation using commitlint.'
    aliases:
      - l:cmt
      - l:commit
      - lint:cmt
    cmds:
      - task: pnpm
        vars: { CLI_ARGS: 'commitlint -v' }
      - task: pnpm
        vars: { CLI_ARGS: 'commitlint --from=HEAD~1 --to=HEAD' }

  lint:symfony:
    desc: 'Runs default Symfony lint commands to validate project'
    aliases:
      - l:sf
      - l:symfony
      - lint:sf
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: '-V' }
      - task: sf:console
        vars: { CLI_ARGS: 'lint:container --no-debug' }
      - task: sf:console
        vars: { CLI_ARGS: 'lint:translations --locale=en' }
      - task: sf:console
        vars: { CLI_ARGS: 'lint:twig templates --env=prod' }
      # - task: sf:console
      #   vars: { CLI_ARGS: 'lint:yaml config --parse-tags' }
      # - task: sf:console
      #   vars: { CLI_ARGS: 'lint:xliff translations' }
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:schema:validate --skip-sync' }

  lint:composer:
    desc: 'Validates composer.json and platform requirements.'
    aliases:
      - l:co
      - l:composer
      - lint:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: '-V' }
      - task: composer
        vars: { CLI_ARGS: 'validate --no-check-version --no-check-publish --strict' }
      - task: composer
        vars: { CLI_ARGS: 'check-platform-req' }

  lint:php-cs-fixer:
    desc: 'Lint php files.'
    aliases:
      - l:p
      - l:csf
      - l:php
      - l:php-cs-fixer
      - lint:p
      - lint:php
      - lint:csf
    cmds:
      - task: php-cs-fixer
        vars: { CLI_ARGS: '--dry-run --diff {{.CLI_ARGS}}' }

  lint:phpstan:
    desc: 'Analyze PHP code for bugs and errors.'
    aliases:
      - l:s
      - l:stan
      - l:phpstan
      - lint:s
      - lint:stan
    cmds:
      - task: phpstan
        vars: { CLI_ARGS: '-V' }
      - task: phpstan
        vars: { CLI_ARGS: 'analyze {{.CLI_ARGS}}' }

  lint:rector:
    desc: 'Check for Rector refactoring suggestions.'
    aliases:
      - l:r
      - l:rector
      - lint:r
    cmds:
      - task: rector
        vars: { CLI_ARGS: '-V' }
      - task: rector
        vars: { CLI_ARGS: '--dry-run {{.CLI_ARGS}}' }

  lint:twig:
    desc: 'Lints Twig files.'
    aliases:
      - l:t
      - l:twig
      - lint:t
    cmds:
      - task: twig-cs-fixer
        vars: { CLI_ARGS: '-V' }
      - task: twig-cs-fixer
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  lint:prettier:
    desc: 'Checks for common format issues with prettier.'
    aliases:
      - l:f
      - l:prt
      - l:format
      - lint:f
      - lint:prt
      - lint:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-v' }
      - task: prettier
        vars: { CLI_ARGS: '. -c' }

  # Fixing:

  fix:
    desc: 'Trying for automated fixes for found problems.'
    aliases:
      - f
    cmds:
      - defer: { task: fix:prettier }
      - defer: { task: fix:twig }
      - defer: { task: fix:rector }
      - defer: { task: fix:php-cs-fixer }
      - defer: { task: fix:composer }

  fix:composer:
    desc: 'Try to fix composer errors.'
    aliases:
      - f:co
      - f:composer
      - fix:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'u --lock --no-scripts --no-plugins --no-autoloader' }
      - task: composer
        vars: { CLI_ARGS: 'bump' }

  fix:php-cs-fixer:
    desc: 'Fix PHP CS Fixer issues.'
    aliases:
      - f:p
      - f:csf
      - f:php
      - f:php-cs-fixer
      - fix:p
      - fix:csf
      - fix:php
    cmds:
      - task: php-cs-fixer

  fix:rector:
    desc: 'Fix Rector issues.'
    aliases:
      - f:r
      - f:rector
    cmds:
      - task: rector
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  fix:twig:
    desc: 'Fix Twig CS Fixer issues.'
    aliases:
      - f:t
      - f:twig
      - fix:t
    cmds:
      - task: twig-cs-fixer
        vars: { CLI_ARGS: '--fix' }

  fix:prettier:
    desc: 'Fix format issues.'
    aliases:
      - f:f
      - f:prt
      - f:format
      - fix:f
      - fix:prt
      - fix:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '. -wl' }

  # Testing:

  test:
    desc: 'Run project test.'
    aliases:
      - t
      - qa
    cmds:
      - task: bin/phpunit
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  test:application:
    desc: 'Run application tests.'
    aliases:
      - t:a
      - t:app
      - t:application
      - qa:a
      - qa:app
      - qa:application
    cmds:
      - task: bin/phpunit
        vars: { CLI_ARGS: '--testsuite=Application {{.CLI_ARGS}}' }

  test:integration:
    desc: 'Run integration tests.'
    aliases:
      - t:i
      - t:integration
      - qa:i
      - qa:integration
    cmds:
      - task: bin/phpunit
        vars: { CLI_ARGS: '--testsuite=Integration {{.CLI_ARGS}}' }

  test:unit:
    desc: 'Run unit tests.'
    aliases:
      - t:u
      - t:unit
      - qa:u
      - qa:unit
    cmds:
      - task: bin/phpunit
        vars: { CLI_ARGS: '--testsuite=Unit {{.CLI_ARGS}}' }
