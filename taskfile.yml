version: 3

env:
  PHP_BIN: '{{.PHP_BIN | default "$(which php)"}}'
  NODE_BIN: '{{.NODE_BIN | default "$(which node)"}}'
  PNPM_BIN: '{{.PNPM_BIN | default "$(which pnpm)"}}'
  COMPOSER_BIN: '{{.COMPOSER_BIN | default "$(which composer)"}}'

vars:
  CONFIG_DIR: '{{.TASKFILE_DIR}}/config/utils'
  NODEJS_BIN_DIR: '{{.TASKFILE_DIR}}/node_modules/.bin'
  COMPOSER_BIN_DIR: '{{.TASKFILE_DIR}}/vendor/bin'

dotenv: ['.env.local', '.env']

tasks:
  default:
    desc: 'List all command.'
    cmd: 'task -l'

  # Utils:

  composer:
    label: 'Composer'
    desc: 'Runs `composer` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN}} {{.CLI_ARGS}} --ansi'
    internal: true
    silent: true

  pnpm:
    label: 'pnpm'
    desc: 'Runs `pnpm` command.'
    cmd: '{{.PNPM_BIN}} {{.CLI_ARGS}}'
    internal: true
    silent: true

  bin/console:
    label: 'Symfony console'
    desc: 'Runs Symfony `bin/console` command.'
    aliases:
      - c
      - sf
      - console
      - symfony
      - sf:console
    cmd: '{{.PHP_BIN}} bin/console {{.CLI_ARGS}} --ansi'
    silent: true

  php-cs-fixer:
    label: 'PHP CS Fixer'
    desc: 'Runs `php-cs-fixer` command.'
    aliases:
      - csf
      - cs-fixer
      - php:cs-fixer
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/php-cs-fixer fix
      --config {{.CONFIG_DIR}}/.php-cs-fixer.php -v {{.CLI_ARGS}} --ansi'
    silent: true
    env:
      # todo: Delete when add support php 8.4.
      PHP_CS_FIXER_IGNORE_ENV: 1

  phpstan:
    label: 'PHPStan'
    desc: 'Runs `phpstan` command.'
    aliases:
      - php:stan
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpstan
      --configuration={{.CONFIG_DIR}}/phpstan.neon {{.CLI_ARGS}} --ansi'
    silent: true

  rector:
    label: 'Rector'
    desc: 'Runs `rector` command.'
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/rector
      --config={{.CONFIG_DIR}}/rector.php {{.CLI_ARGS}} --ansi'
    silent: true

  prettier:
    label: 'Prettier'
    desc: 'Runs `prettier` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/prettier {{.CLI_ARGS}}
      --config={{.CONFIG_DIR}}/.prettierrc.json
      --ignore-path={{.CONFIG_DIR}}/.prettierignore'
    silent: true

  # Work commands:

  cache:clear:
    label: 'Clear the cache'
    desc: ' Clears the application cache for a given environment.'
    aliases:
      - cc
      - cr
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: 'cache:clear' }
    silent: true

  deploy:
    label: 'Deploy'
    desc: 'Deploy code'
    aliases:
      - d
    vars:
      DEV_PACKAGES: '{{if eq .APP_ENV "prod"}}--no-dev{{end}}'
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'i {{.DEV_PACKAGES}} --no-scripts' }
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:migration:migrate -n' }
      - task: cache:clear
      - task: sf:console
        vars: { CLI_ARGS: 'cache:warmup' }

  # Linters:

  lint:
    label: 'Project lint'
    desc: 'Validates project files.'
    aliases:
      - l
    cmds:
      - defer: { task: lint:prettier }
      - defer: { task: lint:rector }
      - defer: { task: lint:phpstan }
      - defer: { task: lint:php-cs-fixer }
      - defer: { task: lint:composer }
      - defer: { task: lint:symfony }
      - defer: { task: lint:commit }
      - defer: { task: lint:branch }

  lint:branch:
    label: 'Lint git branch name'
    desc: 'Validates the current git branch name.'
    aliases:
      - l:b
      - lint:b
    cmds:
      - task: pnpm
        vars: { CLI_ARGS: 'validate-branch-name -v' }
      - task: pnpm
        vars: { CLI_ARGS: 'validate-branch-name' }

  lint:commit:
    label: 'Lint last git commits'
    desc: 'Run commit message validation using commitlint.'
    aliases:
      - l:cmt
      - l:commit
      - lint:cmt
    cmds:
      - task: pnpm
        vars: { CLI_ARGS: 'commitlint -v' }
      - task: pnpm
        vars: { CLI_ARGS: 'commitlint --from=HEAD~1 --to=HEAD' }

  lint:symfony:
    label: 'Symfony lint'
    desc: 'Runs default Symfony lint commands to validate project'
    aliases:
      - l:sf
      - l:symfony
      - lint:sf
    cmds:
      - task: sf:console
        vars: { CLI_ARGS: '-V' }
      - task: sf:console
        vars: { CLI_ARGS: 'lint:container --no-debug' }
      - task: sf:console
        vars: { CLI_ARGS: 'lint:twig templates --env=prod' }
      - task: sf:console
        vars: { CLI_ARGS: 'lint:yaml config --parse-tags' }
      - task: sf:console
        vars: { CLI_ARGS: 'lint:xliff translations' }
      - task: sf:console
        vars: { CLI_ARGS: 'doctrine:schema:validate --skip-sync' }
      # - task: sf:console
      #   vars: { CLI_ARGS: 'lint:translations' }

  lint:composer:
    label: 'Composer validation'
    desc: 'Validates composer.json file and checks platform requirements.'
    aliases:
      - l:co
      - l:composer
      - lint:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: '-V' }
      - task: composer
        vars: { CLI_ARGS: 'validate --strict' }
      - task: composer
        vars: { CLI_ARGS: 'check-platform-req' }

  lint:php-cs-fixer:
    label: 'PHP CS Fixer validation'
    desc: 'Lint php files.'
    aliases:
      - l:p
      - l:csf
      - l:php
      - l:php-cs-fixer
      - lint:p
      - lint:php
      - lint:csf
      - lint:php:cs-fixer
    cmds:
      - task: php-cs-fixer
        vars: { CLI_ARGS: '--dry-run --diff {{.CLI_ARGS}}' }

  lint:phpstan:
    label: 'PHPStan analyze'
    desc: 'Analyze PHP code for bugs and errors.'
    aliases:
      - l:s
      - l:stan
      - l:phpstan
      - lint:s
      - lint:stan
    cmds:
      - task: phpstan
        vars: { CLI_ARGS: '-V' }
      - task: phpstan
        vars: { CLI_ARGS: 'analyze {{.CLI_ARGS}}' }

  lint:rector:
    label: 'Rector check'
    desc: 'Check Rector issues.'
    aliases:
      - l:r
      - l:rector
      - lint:r
    cmds:
      - task: rector
        vars: { CLI_ARGS: '-V' }
      - task: rector
        vars: { CLI_ARGS: 'process --dry-run {{.CLI_ARGS}}' }

  lint:prettier:
    label: 'Prettier'
    desc: 'Checks for common format issues with prettier.'
    aliases:
      - format
      - l:format
      - l:prettier
      - lint:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-v' }
      - task: prettier
        vars: { CLI_ARGS: '. -c' }

  # Fixing:

  fix:
    label: 'Fixing found issues'
    desc: 'Trying for automated fixes for found problems.'
    aliases:
      - f
    cmds:
      - defer: { task: fix:prettier }
      - defer: { task: fix:rector }
      - defer: { task: fix:php-cs-fixer }
      - defer: { task: fix:composer }

  fix:composer:
    label: 'Composer fix'
    desc: 'Try to fix composer errors.'
    aliases:
      - f:co
      - f:composer
      - fix:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'u --lock --no-scripts --no-plugins --no-autoloader' }

  fix:php-cs-fixer:
    label: 'PHP CS Fixer'
    desc: 'Fix PHP CS Fixer issues.'
    aliases:
      - f:php
      - fix:php
      - f:php-cs-fixer
      - fix:php-cs-fixer
    cmds:
      - task: php-cs-fixer

  fix:rector:
    label: 'Rector'
    desc: 'Fix Rector issues.'
    aliases:
      - f:r
      - f:rector
    cmds:
      - task: rector
        vars: { CLI_ARGS: 'process {{.CLI_ARGS}}' }

  fix:prettier:
    label: 'Prettier'
    desc: 'Fix format issues.'
    aliases:
      - f:format
      - f:prettier
      - fix:format
      - format:fix
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '. -wl' }
