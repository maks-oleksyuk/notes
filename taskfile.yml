version: 3

env:
  PHP_BIN: '{{.PHP_BIN | default "$(which php)"}}'
  NODE_BIN: '{{.NODE_BIN | default "$(which node)"}}'
  PNPM_BIN: '{{.PNPM_BIN | default "$(which pnpm)"}}'
  COMPOSER_BIN: '{{.COMPOSER_BIN | default "$(which composer)"}}'

vars:
  CONFIG_DIR: '{{.TASKFILE_DIR}}/config/utils'
  NODEJS_BIN_DIR: '{{.TASKFILE_DIR}}/node_modules/.bin'
  COMPOSER_BIN_DIR: '{{.TASKFILE_DIR}}/vendor/bin'

tasks:
  default:
    desc: 'List all commands.'
    cmd: 'task -l'

  # Utils:

  composer:
    desc: 'Run `composer` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN}} {{.CLI_ARGS}} --ansi'
    internal: true
    silent: true

  pnpm:
    desc: 'Run `pnpm` command.'
    cmd: '{{.PNPM_BIN}} {{.CLI_ARGS}}'
    internal: true
    silent: true

  drush:
    desc: 'Run `drush` command.'
    cmd: '{{.COMPOSER_BIN_DIR}}/drush {{.CLI_ARGS}}'
    silent: true

  dr:
    desc: 'Run `dr` (Drupal core CLI) command.'
    cmd: '{{.COMPOSER_BIN_DIR}}/dr {{.CLI_ARGS}}'
    silent: true

  phpcs:
    desc: 'Run `phpcs` command.'
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpcs -s
      --standard={{.CONFIG_DIR}}/phpcs.xml
      {{.CLI_ARGS}} --colors'
    silent: true

  phpcbf:
    desc: 'Run `phpcbf` command.'
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpcbf -s
      --standard={{.CONFIG_DIR}}/phpcs.xml
      {{.CLI_ARGS}} --colors'
    silent: true

  phpstan:
    desc: 'Run `phpstan` command.'
    aliases:
      - php:stan
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpstan
      --configuration={{.CONFIG_DIR}}/phpstan.neon {{.CLI_ARGS}} --ansi'
    silent: true

  rector:
    desc: 'Run `rector` command.'
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/rector {{.CLI_ARGS}}
      --config={{.CONFIG_DIR}}/rector.php --ansi'
    aliases:
      - r
    silent: true

  twig-cs:
    desc: 'Run `twig-cs-fixer` command.'
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/twig-cs-fixer
      --config={{.CONFIG_DIR}}/.twig-cs-fixer.php
      {{.CLI_ARGS}} --ansi'
    silent: true

  eslint:
    desc: 'Run `eslint` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/eslint
      -c {{.CONFIG_DIR}}/.eslintrc.json
      --cache --cache-location var/cache/eslint/.eslintcache
      {{.CLI_ARGS}} --color'
    silent: true

  stylelint:
    desc: 'Run `stylelint` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/stylelint
      -c {{.CONFIG_DIR}}/.stylelintrc.json
      --cache --cache-location var/cache/stylelint
      --aei {{.CLI_ARGS}} --color'
    silent: true

  prettier:
    desc: 'Run `prettier` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/prettier {{.CLI_ARGS}}
      --config-path={{.CONFIG_DIR}}/.prettierrc.json
      --ignore-path={{.CONFIG_DIR}}/.prettierignore
      --cache --cache-location=var/cache/prettier/prettier.cache'
    aliases:
      - prt
    env:
      PRETTIER_EXPERIMENTAL_CLI: 1
    silent: true

  cspell:
    desc: 'Run `cspell` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/cspell
      -c {{.CONFIG_DIR}}/.cspell.json --color
      {{.CLI_ARGS}}'
    silent: true

  # Work commands:

  cache:clear:
    desc: 'Rebuild all caches.'
    aliases:
      - cc
      - cr
    cmds:
      - task: dr
        vars: { CLI_ARGS: 'cr' }

  install:
    desc: 'Installs a fresh website from existing configuration for development and testing.'
    prompt: |
      This command will delete current database and install a fresh website.
      All unsaved data will be permanently lost.
      Are you sure?
    aliases:
      - i
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'install' }
      - task: drush
        vars: { CLI_ARGS: 'site:install -y --existing-config' }
      # - task: drush
      #   vars: {CLI_ARGS: 'pm:install nts_dev -y'}
      - task: drush
        vars: { CLI_ARGS: 'deploy:mark-complete -y' }
      - task: phpstorm-meta
      - task: drush
        vars: { CLI_ARGS: 'user:login --uid=1' }

  update:
    desc: 'Update project dependencies within constraints.'
    prompt: |
      This command can break website. Do it independently without any other active changes.
      Make sure you have a backup. Never run it on production.
    aliases:
      - u
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'u -W' }
      - task: pnpm
        vars: { CLI_ARGS: 'up --save-exact' }

  build-dictionary:
    desc: 'Builds a project dictionary for CSPell.'
    cmds:
      - task: cspell
        vars: { CLI_ARGS: '--version' }
      - task: cspell
        vars: { CLI_ARGS: '--words-only --unique "**" | sort -f > {{.CONFIG_DIR}}/cspell/dictionary.dic' }

  phpstorm-meta:
    desc: 'Generate PHPStorm metadata files.'
    cmds:
      - task: drush
        vars: { CLI_ARGS: 'generate -y phpstorm-meta' }

  # Linters:

  lint:
    desc: 'Run all linters and validators.'
    aliases:
      - l
    cmds:
      - defer: { task: lint:spellcheck }
      - defer: { task: lint:prettier }
      - defer: { task: lint:js }
      - defer: { task: lint:css }
      - defer: { task: lint:yml }
      - defer: { task: lint:twig }
      - defer: { task: lint:phpstan }
      - defer: { task: lint:phpcs }
      - defer: { task: lint:composer }

  lint:composer:
    desc: 'Validates composer.json and platform requirements.'
    aliases:
      - l:co
      - l:composer
      - lint:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: '-V' }
      - task: composer
        vars: { CLI_ARGS: 'validate --no-check-version --no-check-publish --strict' }
      - task: composer
        vars: { CLI_ARGS: 'check-platform-req' }

  lint:phpcs:
    desc: 'Validate PHP code style (Drupal standards).'
    aliases:
      - l:p
      - l:php
      - l:phpcs
      - lint:p
      - lint:php
    cmds:
      - task: phpcs
        vars: { CLI_ARGS: '--version' }
      - task: phpcs
        vars: { CLI_ARGS: '{{.CLI_ARGS}} || true' } # update when add PHP code

  lint:phpstan:
    desc: 'Analyze PHP code for bugs and errors.'
    aliases:
      - l:s
      - l:stan
      - l:phpstan
      - lint:s
      - lint:stan
    cmds:
      - task: phpstan
        vars: { CLI_ARGS: '-V' }
      - task: phpstan
        vars: { CLI_ARGS: 'analyze {{.CLI_ARGS}} || true' } # update when add PHP code

  lint:rector:
    desc: 'Check for Rector refactoring suggestions.'
    aliases:
      - l:r
      - l:rector
      - lint:r
    cmds:
      - task: rector
        vars: { CLI_ARGS: '-V' }
      - task: rector
        vars: { CLI_ARGS: '--dry-run {{.CLI_ARGS}}' }

  lint:twig:
    desc: 'Lint Twig template files.'
    aliases:
      - l:t
      - l:twig
      - lint:t
    cmds:
      - task: twig-cs
        vars: { CLI_ARGS: '-V' }
      - task: twig-cs
        vars: { CLI_ARGS: 'lint {{.CLI_ARGS}}' }

  lint:prettier:
    desc: 'Check code formatting with Prettier.'
    aliases:
      - l:f
      - l:prt
      - l:format
      - l:prettier
      - lint:f
      - lint:prt
      - lint:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-v' }
      - task: prettier
        vars: { CLI_ARGS: 'app -c' }

  lint:css:
    desc: 'Lint CSS files.'
    aliases:
      - l:css
      - l:style
      - lint:style
    cmds:
      - task: stylelint
        vars: { CLI_ARGS: '-v' }
      - task: stylelint
        vars: { CLI_ARGS: 'app/**/*.css {{.CLI_ARGS}}' }

  lint:js:
    desc: 'Lint JavaScript files.'
    aliases:
      - l:js
      - l:eslint
      - lint:eslint
    cmds:
      - task: eslint
        vars: { CLI_ARGS: '-v' }
      - task: eslint
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  lint:yml:
    desc: 'Lint Y(A)ML files.'
    aliases:
      - l:y
      - l:yml
      - l:yaml
      - lint:y
      - lint:yaml
    cmds:
      - task: eslint
        vars: { CLI_ARGS: '-v' }
      - task: eslint
        vars: { CLI_ARGS: '--ext .yml --ext .yaml {{.CLI_ARGS}}' }

  lint:spellcheck:
    desc: 'Check for spelling issues.'
    aliases:
      - l:cspell
      - l:spellcheck
      - lint:cspell
    cmds:
      - task: cspell
        vars: { CLI_ARGS: '--version' }
      - task: cspell
        vars: { CLI_ARGS: '--no-progress "**" {{.CLI_ARGS}}' }

  # Fixing:

  fix:
    desc: 'Run all automated fixers.'
    aliases:
      - f
    cmds:
      - defer: { task: fix:phpcs }
      - defer: { task: fix:js }
      - defer: { task: fix:css }
      - defer: { task: fix:yml }
      - defer: { task: fix:twig }
      - defer: { task: fix:prettier }
      - defer: { task: fix:composer }

  fix:composer:
    desc: 'Fix Composer lock file and dependencies.'
    aliases:
      - f:co
      - f:composer
      - fix:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: '-V' }
      - task: composer
        vars: { CLI_ARGS: 'u --lock --no-scripts --no-plugins --no-autoloader' }
      - task: composer
        vars: { CLI_ARGS: 'bump' }

  fix:phpcs:
    desc: 'Auto-fix PHP code style issues.'
    aliases:
      - f:p
      - f:php
      - f:phpcs
      - fix:p
      - fix:php
    cmds:
      - task: phpcs
        vars: { CLI_ARGS: '--version' }
      - task: phpcbf

  fix:rector:
    desc: 'Apply Rector refactoring suggestions.'
    aliases:
      - f:r
      - f:rector
      - fix:r
    cmds:
      - task: rector
        vars: { CLI_ARGS: '-V' }
      - task: rector
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  fix:twig:
    desc: 'Auto-fix Twig template issues.'
    aliases:
      - f:t
      - f:twig
      - fix:t
    cmds:
      - task: twig-cs
        vars: { CLI_ARGS: '-V' }
      - task: twig-cs
        vars: { CLI_ARGS: 'fix {{.CLI_ARGS}}' }

  fix:prettier:
    desc: 'Auto-fix code formatting with Prettier.'
    aliases:
      - f:f
      - f:prt
      - f:format
      - f:prettier
      - fix:f
      - fix:prt
      - fix:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-v' }
      - task: prettier
        vars: { CLI_ARGS: 'app -wl' }

  fix:css:
    desc: 'Auto-fix CSS/SCSS issues.'
    aliases:
      - f:css
      - f:style
      - fix:style
    cmds:
      - task: stylelint
        vars: { CLI_ARGS: '-v' }
      - task: lint:css
        vars: { CLI_ARGS: '--fix' }

  fix:js:
    desc: 'Auto-fix JavaScript issues.'
    aliases:
      - f:js
      - f:eslint
      - fix:eslint
    cmds:
      - task: eslint
        vars: { CLI_ARGS: '-v' }
      - task: eslint
        vars: { CLI_ARGS: '--fix' }

  fix:yml:
    desc: 'Auto-fix Y(A)ML formatting.'
    aliases:
      - f:y
      - fix:y
      - fix:yaml
    cmds:
      - task: eslint
        vars: { CLI_ARGS: '-v' }
      - task: lint:yml
        vars: { CLI_ARGS: '--fix' }
