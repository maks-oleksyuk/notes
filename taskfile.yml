version: 3

env:
  WP_BIN: '{{.WP_BIN | default "$(which wp)"}}'
  PHP_BIN: '{{.PHP_BIN | default "$(which php)"}}'
  NODE_BIN: '{{.NODE_BIN | default "$(which node)"}}'
  PNPM_BIN: '{{.PNPM_BIN | default "$(which pnpm)"}}'
  COMPOSER_BIN: '{{.COMPOSER_BIN | default "$(which composer)"}}'

vars:
  CONFIG_DIR: '{{.TASKFILE_DIR}}/config/utils'
  NODEJS_BIN_DIR: '{{.TASKFILE_DIR}}/node_modules/.bin'
  COMPOSER_BIN_DIR: '{{.TASKFILE_DIR}}/vendor/bin'

tasks:
  default:
    desc: 'List all command.'
    cmd: 'task -l'

  # Utils:

  composer:
    label: 'Composer'
    desc: 'Runs `composer` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN}} {{.CLI_ARGS}} --ansi'
    internal: true
    silent: true

  pnpm:
    label: 'pnpm'
    desc: 'Runs `pnpm` command.'
    cmd: '{{.PNPM_BIN}} {{.CLI_ARGS}}'
    internal: true
    silent: true

  wp:
    label: 'wp'
    desc: 'Runs `wp` command.'
    cmd: '{{.WP_BIN}} {{.CLI_ARGS}} --color'
    silent: true

  phpcs:
    label: 'PHPCS'
    desc: 'Runs `phpcs` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpcs -ps --colors --standard={{.CONFIG_DIR}}/phpcs.xml {{.CLI_ARGS}}'
    internal: true
    silent: true

  phpcbf:
    label: 'PHPCBF'
    desc: 'Runs `phpcbf` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpcbf -ps --colors --standard={{.CONFIG_DIR}}/phpcs.xml {{.CLI_ARGS}}'
    internal: true
    silent: true

  prettier:
    label: 'Prettier'
    desc: 'Runs `prettier` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/prettier {{.CLI_ARGS}}
      --config={{.CONFIG_DIR}}/.prettierrc.json
      --ignore-path={{.CONFIG_DIR}}/.prettierignore'
    silent: true

  # Work commands:

  cache:clear:
    label: 'Cache clear'
    desc: 'Clear WP cache'
    aliases:
      - cc
      - cf
      - cr
      - cache:flush
    cmds:
      - task: wp
        vars: { CLI_ARGS: 'cache flush' }

  update:
    label: 'Update project'
    desc: 'Updates project dependencies withing constraints.'
    prompt: |
      This command can break website. Do it independently without any other active changes.
      Make sure you have a backup. Never run it on production.
    aliases:
      - u
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'u -W' }
      - task: pnpm
        vars: { CLI_ARGS: 'up --save --latest' }

  # Linters:

  lint:
    label: 'Project lint'
    desc: 'Validates project files.'
    aliases:
      - l
    cmds:
      - defer: { task: lint:plugin }
      - defer: { task: lint:prettier }
      - defer: { task: lint:phpcs }
      - defer: { task: lint:composer }
      - defer: { task: lint:commit }
      - defer: { task: lint:branch }

  lint:branch:
    label: 'Lint git branch name'
    desc: 'Validates the current git branch name.'
    aliases:
      - l:b
      - lint:b
    cmds:
      - task: pnpm
        vars: { CLI_ARGS: 'validate-branch-name -v' }
      - task: pnpm
        vars: { CLI_ARGS: 'validate-branch-name' }

  lint:commit:
    label: 'Lint last git commits'
    desc: 'Run commit message validation using commitlint.'
    aliases:
      - l:cmt
      - l:commit
      - lint:cmt
    cmds:
      - task: pnpm
        vars: { CLI_ARGS: 'commitlint -v' }
      - task: pnpm
        vars: { CLI_ARGS: 'commitlint --from=HEAD~1 --to=HEAD' }

  lint:composer:
    label: 'Composer validation'
    desc: 'Validates composer.json file and checks platform requirements.'
    aliases:
      - l:co
      - l:composer
      - lint:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: '-V' }
      - task: composer
        vars: { CLI_ARGS: 'validate --no-check-version --no-check-publish --strict' }
      - task: composer
        vars: { CLI_ARGS: 'check-platform-req' }

  lint:phpcs:
    label: 'PHPCS validation'
    desc: 'Validate PHP for code style.'
    aliases:
      - l:p
      - l:php
      - l:pcs
      - l:phpcs
      - lint:p
      - lint:php
      - lint:pcs
    cmds:
      - task: phpcs

  lint:prettier:
    label: 'Prettier'
    desc: 'Checks for common format issues with prettier.'
    aliases:
      - l:f
      - l:prt
      - l:format
      - l:prettier
      - lint:f
      - lint:prt
      - lint:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-v' }
      - task: prettier
        vars: { CLI_ARGS: '. -c' }

  lint:plugin:
    label: 'WP Plugin Check'
    aliases:
      - l:plg
      - l:plugin
      - lint:plg
    cmds:
      - task: wp
        vars: { CLI_ARGS: 'plugin check nts-site --exclude-directories=import --include-experimental' }

  # Fixing:

  fix:
    label: 'Fixing found issues'
    desc: 'Trying for automated fixes for found problems.'
    aliases:
      - f
    cmds:
      - defer: { task: fix:prettier }
      - defer: { task: fix:phpcs }
      - defer: { task: fix:composer }

  fix:composer:
    label: 'Composer fix'
    desc: 'Try to fix composer errors.'
    aliases:
      - f:co
      - f:composer
      - fix:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'u --lock --no-scripts --no-plugins --no-autoloader' }
      - task: composer
        vars: { CLI_ARGS: 'bump' }

  fix:phpcs:
    label: 'PHPCS'
    desc: 'Fix PHPCS issues.'
    aliases:
      - f:php
    cmds:
      - task: phpcbf

  fix:prettier:
    label: 'Prettier'
    desc: 'Fix format issues.'
    aliases:
      - f:f
      - f:prt
      - f:format
      - f:prettier
      - fix:f
      - fix:prt
      - fix:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '. -wl' }

  # Testing:
