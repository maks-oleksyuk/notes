version: 3

env:
  NODE_BIN: '{{.NODE_BIN | default "$(which node)"}}'
  PNPM_BIN: '{{.PNPM_BIN | default "$(which pnpm)"}}'

vars:
  CONFIG_DIR: '{{.TASKFILE_DIR}}/config/utils'
  NODEJS_BIN_DIR: '{{.TASKFILE_DIR}}/node_modules/.bin'

tasks:
  default:
    desc: 'List all commands.'
    cmd: 'task -l'

  # Utils:

  pnpm:
    desc: 'Run `pnpm` command.'
    cmd: '{{.PNPM_BIN}} {{.CLI_ARGS}}'
    silent: true

  tsc:
    desc: 'Run `tsc` command.'
    cmd: '{{.NODEJS_BIN_DIR}}/tsc {{.CLI_ARGS}}'
    silent: true

  biome:
    desc: 'Run `biome` command.'
    cmd: '{{.NODEJS_BIN_DIR}}/biome {{.CLI_ARGS}} --colors=force'
    env:
      BIOME_CONFIG_PATH: '{{.CONFIG_DIR}}/biome.json'
    silent: true

  next:
    desc: 'Run `next` command.'
    cmd: '{{.NODEJS_BIN_DIR}}/next {{.CLI_ARGS}}'
    silent: true

  vitest:
    desc: 'Run `vitest` command.'
    cmd: '{{.NODEJS_BIN_DIR}}/vitest --config {{.CONFIG_DIR}}/vitest.config.ts {{.CLI_ARGS}}'
    silent: true

  vitest:browser:
    desc: 'Run `vitest` command against the browser (real Chromium) config.'
    cmd: '{{.NODEJS_BIN_DIR}}/vitest --config {{.CONFIG_DIR}}/vitest.browser.config.ts {{.CLI_ARGS}}'
    silent: true

  # Work commands:

  build:
    desc: 'Run `next build`'
    aliases:
      - b
    cmds:
      - task: next
        vars: { CLI_ARGS: 'build' }

  dev:
    desc: 'Run `next dev`'
    aliases:
      - d
    cmds:
      - task: next
        vars: { CLI_ARGS: 'dev' }

  start:
    desc: 'Run `next start` (no build)'
    aliases:
      - s
    cmds:
      - task: next
        vars: { CLI_ARGS: 'start' }

  prod:
    desc: 'Run `next build` then `next start`'
    aliases:
      - p
    cmds:
      - task: build
      - task: start

  update:
    desc: 'Updates project dependencies withing constraints.'
    prompt: |
      This command can break website. Do it independently without any other active changes.
      Make sure you have a backup. Never run it on production.
    aliases:
      - u
    cmds:
      - task: pnpm
        vars: { CLI_ARGS: 'up --save --latest' }

  # Linters:

  lint:
    desc: 'Run all linters and validators.'
    aliases:
      - l
    cmds:
      - defer: { task: lint:biome }
      - defer: { task: lint:type }

  lint:biome:
    desc: 'Run biome checks'
    aliases:
      - l:b
      - l:biome
      - lint:b
    cmds:
      - task: biome
        vars: { CLI_ARGS: '-V' }
      - task: biome
        vars: { CLI_ARGS: 'format {{.CLI_ARGS}}' }
      - task: biome
        vars: { CLI_ARGS: 'lint {{.CLI_ARGS}}' }
      - task: biome
        vars: { CLI_ARGS: 'check {{.CLI_ARGS}}' }

  lint:type:
    desc: 'Run TypeScript type checking'
    aliases:
      - l:t
      - l:type
      - lint:t
    cmds:
      - task: tsc
        vars: { CLI_ARGS: '-V' }
      - task: tsc
        vars: { CLI_ARGS: '--noEmit --incremental --pretty' }

  # Fixing:

  fix:
    desc: 'Run all automated fixers.'
    aliases:
      - f
    cmds:
      - defer: { task: fix:biome }

  fix:biome:
    desc: 'Auto-fix code formatting with Biome.'
    aliases:
      - f:b
      - f:biome
      - fix:b
    cmds:
      - task: biome
        vars: { CLI_ARGS: '-V' }
      - task: biome
        vars: { CLI_ARGS: 'format --write' }
      - task: biome
        vars: { CLI_ARGS: 'lint --write --unsafe' }
      - task: biome
        vars: { CLI_ARGS: 'check --write --unsafe' }

  # Testing:

  test:
    desc: 'Run project test.'
    aliases:
      - t
      - qa
    cmds:
      - defer: { task: test:browser }
      - defer: { task: test:unit }

  test:unit:
    desc: 'Run the unit suite once (coverage + JUnit report in var/report/).'
    aliases:
      - t:u
    cmds:
      - task: vitest
        vars: { CLI_ARGS: 'run --coverage {{.CLI_ARGS}}' }

  test:watch:
    desc: 'Run the test suite in watch mode.'
    aliases:
      - t:w
    cmds:
      - task: vitest
        vars: { CLI_ARGS: 'watch {{.CLI_ARGS}}' }

  test:browser:
    desc: 'Run the browser suite once (real Chromium via Playwright).'
    aliases:
      - t:b
    cmds:
      - task: vitest:browser
        vars: { CLI_ARGS: 'run --coverage {{.CLI_ARGS}}' }

  test:browser:watch:
    desc: 'Watch a real headed Chromium window run the browser suite (needs a display, or remote-desktop/VNC access if running headless).'
    aliases:
      - t:b:w
    cmds:
      - task: vitest:browser
        vars: { CLI_ARGS: 'watch --ui --browser.headless=false {{.CLI_ARGS}}' }
