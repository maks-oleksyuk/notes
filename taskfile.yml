version: 3

env:
  PHP_BIN: '{{.PHP_BIN | default "$(which php)"}}'
  NODE_BIN: '{{.NODE_BIN | default "$(which node)"}}'
  PNPM_BIN: '{{.PNPM_BIN | default "$(which pnpm)"}}'
  COMPOSER_BIN: '{{.COMPOSER_BIN | default "$(which composer)"}}'

vars:
  CONFIG_DIR: '{{.TASKFILE_DIR}}/config/utils'
  NODEJS_BIN_DIR: '{{.TASKFILE_DIR}}/node_modules/.bin'
  COMPOSER_BIN_DIR: '{{.TASKFILE_DIR}}/vendor/bin'

tasks:
  default:
    desc: 'List all command.'
    cmd: 'task -l'

  # Utils:

  composer:
    label: 'Composer'
    desc: 'Runs `composer` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN}} {{.CLI_ARGS}} --ansi'
    internal: true
    silent: true

  pnpm:
    label: 'pnpm'
    desc: 'Runs `pnpm` command.'
    cmd: '{{.PNPM_BIN}} {{.CLI_ARGS}}'
    internal: true
    silent: true

  drush:
    label: 'Drush'
    desc: 'Runs `drush` command.'
    cmd: '{{.COMPOSER_BIN_DIR}}/drush {{.CLI_ARGS}}'
    silent: true

  phpcs:
    label: 'PHPCS'
    desc: 'Runs `phpcs` command.'
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpcs -s
      --standard={{.CONFIG_DIR}}/phpcs.xml
      {{.CLI_ARGS}} --colors'
    silent: true

  phpcbf:
    label: 'PHPCBF'
    desc: 'Runs `phpcbf` command.'
    cmd:
      '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpcbf -s
      --standard={{.CONFIG_DIR}}/phpcs.xml
      {{.CLI_ARGS}} --colors'
    silent: true

  phpstan:
    label: 'PHPStan'
    desc: 'Runs `phpstan` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/phpstan --configuration={{.CONFIG_DIR}}/phpstan.neon {{.CLI_ARGS}}'
    silent: true

  twigcs:
    label: 'TWIGCS'
    desc: 'Runs `twig-cs-fixer` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/twig-cs-fixer lint --config={{.CONFIG_DIR}}/.twig-cs-fixer.php ./app/Drupal --ansi {{.CLI_ARGS}}'
    silent: true

  eslint:
    label: 'ESLint'
    desc: 'Runs `eslint` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/eslint
      -c {{.CONFIG_DIR}}/.eslintrc.json
      --cache --cache-location var/cache/eslint/.eslintcache
      {{.CLI_ARGS}} --color'
    silent: true

  stylelint:
    label: 'Stylelint'
    desc: 'Runs `stylelint` command.'
    cmd: '{{.NODEJS_BIN_DIR}}/stylelint -c {{.CONFIG_DIR}}/.stylelintrc.json {{.CLI_ARGS}}'
    silent: true

  cspell:
    label: 'CSPell'
    desc: 'Runs `cspell` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/cspell
      -c {{.CONFIG_DIR}}/.cspell.json --color
      {{.CLI_ARGS}}'
    silent: true

  prettier:
    label: 'Prettier'
    desc: 'Runs `prettier` command.'
    cmd:
      '{{.NODEJS_BIN_DIR}}/prettier {{.CLI_ARGS}}
      --config={{.CONFIG_DIR}}/.prettierrc.json
      --ignore-path={{.CONFIG_DIR}}/.prettierignore
      --cache --cache-location=var/cache/prettier/prettier.cache'
    silent: true

  rector:
    label: 'Rector'
    desc: 'Runs `rector` command.'
    cmd: '{{.PHP_BIN}} {{.COMPOSER_BIN_DIR}}/rector process --config={{.CONFIG_DIR}}/rector.php app --ansi {{.CLI_ARGS}}'
    silent: true

  # Work commands:

  phpstorm-meta:
    label: 'PHPStorm metadata'
    desc: 'Generates PHPStorm metadata.'
    cmds:
      - task: drush
        vars: { CLI_ARGS: 'generate -y phpstorm-meta' }

  install:
    desc: 'Install website.'
    summary: 'Installs a website with a demo content for development and testing.'
    prompt: |
      This command will delete current database and install a fresh website.
      All unsaved data will be permanently lost.
      Are you sure?
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'install' }
      - task: drush
        vars: { CLI_ARGS: 'site:install -y --existing-config' }
      # - task: drush
      #   vars: {CLI_ARGS: 'pm:install nts_dev -y'}
      - task: drush
        vars: { CLI_ARGS: 'deploy:mark-complete -y' }
      - task: phpstorm-meta
      - task: drush
        vars: { CLI_ARGS: 'user:login --uid=1' }

  update:
    label: 'Update project'
    desc: 'Updates project dependencies withing constraints.'
    prompt: |
      This command can break website. Do it independently without any other active changes.
      Make sure you have a backup. Never run it on production.
    aliases:
      - u
    cmds:
      - task: composer
        vars: { CLI_ARGS: 'u -W' }
      - task: pnpm
        vars: { CLI_ARGS: 'up --save' }

  build-dictionary:
    label: 'Builds dictionary'
    desc: 'Builds a project dictionary for CSPell.'
    cmds:
      - task: cspell
        vars: { CLI_ARGS: '--version' }
      - task: cspell
        vars: { CLI_ARGS: '--words-only --unique "**" | sort -f > {{.CONFIG_DIR}}/cspell/dictionary.dic' }

  # Linters:

  lint:
    label: 'Project lint'
    desc: 'Validates project files.'
    aliases:
      - l
    cmds:
      - defer: { task: lint:spellcheck }
      - defer: { task: lint:prettier }
      - defer: { task: lint:js }
      - defer: { task: lint:css }
      - defer: { task: lint:yml }
      - defer: { task: lint:twig }
      - defer: { task: lint:phpstan }
      - defer: { task: lint:phpcs }
      - defer: { task: lint:composer }

  lint:composer:
    label: 'Composer validation'
    desc: 'Validates composer.json file and checks platform requirements.'
    aliases:
      - l:co
      - l:composer
      - lint:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: '-V' }
      - task: composer
        vars: { CLI_ARGS: 'validate --no-check-version --no-check-publish --strict' }
      - task: composer
        vars: { CLI_ARGS: 'check-platform-req' }

  lint:phpcs:
    label: 'PHPCS validation'
    desc: 'Validate PHP for code style.'
    aliases:
      - l:p
      - l:php
      - l:phpcs
      - lint:p
      - lint:php
    cmds:
      - task: phpcs
        vars: { CLI_ARGS: '--version' }
      - task: phpcs

  lint:phpstan:
    label: 'PHPStan analyze'
    desc: 'Analyze PHP code for bugs and errors.'
    cmds:
      - task: phpstan
        vars: { CLI_ARGS: 'analyze' }

  lint:js:
    label: 'JavaScript linter'
    desc: 'Lints JavaScript files.'
    aliases:
      - l:js
      - l:eslint
      - lint:eslint
    cmds:
      - task: eslint
        vars: { CLI_ARGS: '-v' }
      - task: eslint
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  lint:css:
    label: 'CSS linter'
    desc: 'Lints CSS files.'
    aliases:
      - csslint
      - lint:style
    cmds:
      - task: stylelint
        vars: { CLI_ARGS: 'app/**/*.css {{.CLI_ARGS}}' }

  lint:yml:
    label: 'YML linter'
    desc: 'Lints Y(A)ML files.'
    aliases:
      - ymllint
      - yamllint
      - lint:yaml
    cmds:
      - task: eslint
        vars: { CLI_ARGS: '-c {{.CONFIG_DIR}}/.eslintrc.json --ext .yml --ext .yaml {{.CLI_ARGS}}' }

  lint:twig:
    label: 'Twig linter'
    desc: 'Lints TWIG files.'
    aliases:
      - twiglint
    cmds:
      - task: twigcs
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  lint:spellcheck:
    label: 'Spellcheck'
    desc: 'Checks for common spelling issues.'
    aliases:
      - l:cspell
      - l:spellcheck
      - lint:cspell
    cmds:
      - task: cspell
        vars: { CLI_ARGS: '--version' }
      - task: cspell
        vars: { CLI_ARGS: '--no-progress "**" {{.CLI_ARGS}}' }

  lint:prettier:
    label: 'Prettier'
    desc: 'Checks for common format issues with prettier.'
    aliases:
      - format
      - lint:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-c app' }

  lint:rector:
    label: 'Rector check'
    desc: 'Check Rector issues.'
    cmds:
      - task: rector
        vars: { CLI_ARGS: '--dry-run' }

  # Fixing:

  fix:
    label: 'Fixing found issues'
    desc: 'Trying for automated fixes for found problems.'
    cmds:
      - defer: { task: fix:phpcs }
      - defer: { task: fix:js }
      - defer: { task: fix:css }
      - defer: { task: fix:yml }
      - defer: { task: fix:twig }
      - defer: { task: fix:prettier }
      - defer: { task: fix:composer }

  fix:composer:
    label: 'Composer fix'
    desc: 'Try to fix composer errors.'
    aliases:
      - f:co
      - f:composer
      - fix:co
    cmds:
      - task: composer
        vars: { CLI_ARGS: '-V' }
      - task: composer
        vars: { CLI_ARGS: 'u --lock --no-scripts --no-plugins --no-autoloader' }
      - task: composer
        vars: { CLI_ARGS: 'bump' }

  fix:phpcs:
    label: 'PHPCS'
    desc: 'Fix PHPCS issues.'
    aliases:
      - f:p
      - f:php
      - f:phpcs
      - fix:p
      - fix:php
    cmds:
      - task: phpcs
        vars: { CLI_ARGS: '--version' }
      - task: phpcbf

  fix:js:
    label: 'JavaScript'
    desc: 'Fix JavaScript issues.'
    aliases:
      - f:js
      - f:eslint
      - fix:eslint
    cmds:
      - task: eslint
        vars: { CLI_ARGS: '-v' }
      - task: eslint
        vars: { CLI_ARGS: '--fix' }

  fix:css:
    label: 'CSS'
    desc: 'Fix CSS issues.'
    cmds:
      - task: lint:css
        vars: { CLI_ARGS: '--fix' }

  fix:yml:
    label: 'Y(A)ML'
    desc: 'Fix Y(A)ML issues.'
    aliases:
      - fix:yaml
    cmds:
      - task: lint:yml
        vars: { CLI_ARGS: '--fix' }

  fix:twig:
    label: 'TWIG'
    desc: 'Fix TWIG issues.'
    cmds:
      - task: lint:twig
        vars: { CLI_ARGS: '--fix' }

  fix:prettier:
    label: 'Prettier'
    desc: 'Fix TWIG issues.'
    aliases:
      - fix:format
    cmds:
      - task: prettier
        vars: { CLI_ARGS: '-wl app' }

  fix:rector:
    label: 'Rector'
    desc: 'Fix Rector issues.'
    cmds:
      - task: rector
