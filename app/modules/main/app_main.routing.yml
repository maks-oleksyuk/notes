# Basic admin route for toolbar item.

app_main.admin:
  path: '/admin/notes'
  defaults:
    _title: 'Notes Admin panel'
    _controller: '\Drupal\system\Controller\SystemController::overview'
    link_id: app_main.admin
  requirements:
    _permission: 'access administration pages'

# Basic admin routes for categories.

app_main.admin.add:
  path: '/admin/notes/add'
  defaults:
    _title: 'Add'
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
  requirements:
    _permission: 'access administration pages'

app_main.admin.content:
  path: '/admin/notes/content'
  defaults:
    _title: 'Content'
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
  requirements:
    _permission: 'access administration pages'

app_main.admin.structure:
  path: '/admin/notes/structure'
  defaults:
    _title: 'Structure'
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
  requirements:
    _permission: 'access administration pages'

app_main.admin.settings:
  path: '/admin/notes/settings'
  defaults:
    _title: 'Settings'
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
  requirements:
    _permission: 'access administration pages'
